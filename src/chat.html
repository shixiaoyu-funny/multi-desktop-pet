<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suki · AI 聊天</title>
  <link rel="stylesheet" href="chat.css?v=4" />
</head>
<body>
  <header class="chat-head">
    <div class="who">
      <div class="avatar">S</div>
      <div>
        <div class="name">Suki</div>
        <div class="sub" id="status">正在连接…</div>
      </div>
    </div>
    <div class="head-actions">
      <button id="btnSetup" title="配置 API Key">设置</button>
      <button id="btnClear" title="清空会话">清空</button>
    </div>
  </header>

  <main class="messages" id="messages"></main>

  <footer class="composer">
    <textarea id="input" rows="2" placeholder="和 Suki 说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" title="发送">发送</button>
  </footer>

  <div class="confirm-mask hidden" id="confirmMask">
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmText">
      <div class="confirm-text" id="confirmText"></div>
      <div class="confirm-actions">
        <button type="button" id="confirmCancel">取消</button>
        <button type="button" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <script src="chat.js?v=4"></script>
</body>
</html>
